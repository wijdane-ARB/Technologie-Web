<!DOCTYPE html>
<html>
<body>
    <input type="text" id="num1" placeholder="Nombre 1"><br>
    <input type="text" id="num2" placeholder="Nombre 2"><br>
    <br><br>
    
    <button onclick="calculer('+')"> + </button>
    <button onclick="calculer('-')"> - </button>
    <button onclick="calculer('*')"> * </button>
    <button onclick="calculer('/')"> / </button>
    <br><br>
    
    <input type="text" id="resultat" placeholder="Résultat" readonly>

    <script>
        function calculer(operateur) {
            let num1 = document.getElementById("num1").value;
            let num2 = document.getElementById("num2").value;
            let resultat;

            switch (operateur) {
                case '+':
                    resultat = num1 + num2;
                    break;
                case '-':
                    resultat = num1 + num2;
                    break;
                case '*':
                    resultat = num1 * num2;
                    break;
                case '/':
                    if (num2 === '0') {
                        alert("Erreur : Division par zéro !");
                        return;
                    }
                    resultat = num1 / num2;
                    break;
                default:
                    alert("Opérateur inconnu !");
                    return;
            }
            document.getElementById("resultat").value = resultat;
        }
                  
    </script>
   
</body>
</html>
