<!DOCTYPE html>
<html>
<body>
    <script>
        let A = parseFloat(prompt("Pour un nombre A entre 1 et 100 : "));
        let u = A / 2;
        
        let ecart = (u * u) - A;
        
        if (ecart < 0) {
            ecart = -ecart;
        }

        while (ecart >= 0.00001) {
            u = 0.5 * (u + (A / u));
            
            ecart = (u * u) - A;
            if (ecart < 0) {
                ecart = -ecart;
            }
        }

        alert("Valeur approchée de la racine carrée :\n" + u);
    </script>
</body>
</html>
