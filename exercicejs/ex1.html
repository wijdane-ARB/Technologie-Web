<!doctype html>
<html>
  <body>
    <script>
      function degreC() {
        let tempF = parseFloat(prompt("Une température en Fahrenheit : "));
        let tempC = (((tempF - 32) * 5) / 9).toFixed(1);
        alert("Cette température équivaut à " + tempC + " degrés Celsius");
      }
      degreC();
    </script>
  </body>
</html>
