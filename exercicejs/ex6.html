<!DOCTYPE html>
<html>
<body>
    <script>
        let n = parseInt(prompt("Un entier positif : "));
        let estPremier = true;
        let diviseur = 0;

        for (let i = 2; i < n; i = i + 1) {
            if (n % i === 0) {
                estPremier = false;
                diviseur = i; 
                break; 
            }
        }

        if (estPremier == true) {
            alert(n + " est un nombre premier");
        } else {
            alert(n + " n'est pas un nombre premier, il est divisible par " + diviseur);
        }
    </script>
</body>
</html>
