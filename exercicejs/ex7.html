<!DOCTYPE html>
<html>
<body>
    <script>
        let n = parseInt(prompt("Entrez n pour calculer le n-ième terme de Fibonacci : "));
        
        let u0 = 0; 
        let u1 = 1; 
        let un = 0; 
        
        if (n === 0) {
            un = u0;
        } else if (n === 1) {
            un = u1;
        } else {
            for (let i = 2; i <= n; i = i + 1) {
                un = u0 + u1; 
                u0 = u1;      
                u1 = un;      
            }
        }

        alert("Le terme de rang " + n + " est : " + un);
    </script>
</body>
</html>
